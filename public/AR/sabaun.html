<!doctype html>
<html lang="tet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabaun AR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500&display=swap">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
<style>
  :root {
    --ink: #17332f;
    --soap: #9cc83c;
    --leaf: #2f8a4f;
    --cape: #d9302a;
    --panel: rgba(255, 255, 255, 0.94);
    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: var(--body); color: var(--ink); }
  #ar { position: fixed; inset: 0; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 20;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
    display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none;
  }
  .pill { pointer-events: auto; background: var(--panel); border-radius: 999px; padding: 6px 14px; font: 800 18px var(--display); box-shadow: 0 2px 8px rgba(0,0,0,.25); font-variant-numeric: tabular-nums; }
  .lang { pointer-events: auto; display: flex; background: var(--panel); border-radius: 999px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .lang button { font: 500 13px var(--body); border: 0; background: transparent; color: var(--ink); padding: 8px 12px; }
  .lang button[aria-pressed="true"] { background: var(--leaf); color: #fff; }

  .card {
    position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    width: min(92vw, 420px); box-sizing: border-box;
    background: var(--panel); border-radius: 18px; padding: 14px 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); display: grid; gap: 6px; text-align: center;
  }
  .card h2 { margin: 0; font: 800 24px/1.1 var(--display); }
  .card p { margin: 0; font-size: 15px; line-height: 1.4; }
  .timer { font: 800 56px/1 var(--display); color: var(--leaf); font-variant-numeric: tabular-nums; }
  .btn { justify-self: center; font: 600 16px var(--body); border: 0; border-radius: 999px; padding: 10px 22px; background: var(--cape); color: #fff; margin-top: 4px; }
  .btn:focus-visible, .lang button:focus-visible { outline: 3px solid var(--soap); outline-offset: 2px; }

  .start { position: fixed; inset: 0; z-index: 30; background: #eef6e4; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .start-inner { max-width: 360px; display: grid; gap: 12px; text-align: center; }
  .start h1 { margin: 0; font: 800 40px/1 var(--display); color: var(--leaf); }
  .start p { margin: 0; font-size: 16px; line-height: 1.45; }
  .start .note { font-size: 12px; color: #4d6863; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="ar"></div>

<div class="start" id="start">
  <div class="start-inner">
    <h1 data-t="startTitle">Sabaun duni baktéria!</h1>
    <p data-t="startBody">Loke kámera, depois hatudu telefone ba pájina 23 iha Lafaek Prima.</p>
    <button class="btn" id="go" type="button" data-t="startBtn">Hahú</button>
    <div class="lang" style="justify-self:center">
      <button type="button" data-lang="tet" aria-pressed="true">TET</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <p class="note" data-t="draft">Protótipu. Tetun ne'e draft, tradutór sira tenke verifika.</p>
  </div>
</div>

<div class="hud" hidden id="hud">
  <span class="pill" id="count">8</span>
  <div class="lang">
    <button type="button" data-lang="tet" aria-pressed="true">TET</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</div>

<div class="card" hidden id="card" aria-live="polite">
  <h2 id="cardTitle"></h2>
  <div class="timer" id="timer" hidden>20</div>
  <p id="cardBody"></p>
  <button class="btn" id="cardBtn" type="button" hidden></button>
</div>

<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

const T = {
  tet: {
    startTitle: "Sabaun duni baktéria!",
    startBody: "Loke kámera, depois hatudu telefone ba pájina 23 iha Lafaek Prima.",
    startBtn: "Hahú",
    draft: "Protótipu. Tetun ne'e draft, tradutór sira tenke verifika.",
    findTitle: "Buka pájina",
    findBody: "Hatudu telefone ba pájina 23.",
    tapTitle: "Ajuda SABAUN!",
    tapBody: "Toka baktéria sira atu duni sira.",
    left: n => `Baktéria ${n}`,
    cleanTitle: "Liman moos ona!",
    cleanBody: "Agora ita-nia rasik. Fase-liman ho sabaun durante segundu 20.",
    timerBtn: "Hahú segundu 20",
    washTitle: "Kose liman!",
    washBody: "Kose liman-laran, liman-kotuk no entre liman-fuan.",
    doneTitle: "Di'ak loos!",
    doneBody: "Fase-liman ho sabaun hadook ita husi baktéria.",
    again: "Halimar fali"
  },
  en: {
    startTitle: "Soap chases the germs!",
    startBody: "Turn on the camera, then point your phone at page 23 of Lafaek Prima.",
    startBtn: "Start",
    draft: "Prototype. Tetun is a draft for the translators to check.",
    findTitle: "Find the page",
    findBody: "Point your phone at page 23.",
    tapTitle: "Help SABAUN!",
    tapBody: "Tap the germs to chase them away.",
    left: n => `${n} germs`,
    cleanTitle: "Clean hands!",
    cleanBody: "Now it's your turn. Wash your hands with soap for 20 seconds.",
    timerBtn: "Start 20 seconds",
    washTitle: "Scrub!",
    washBody: "Scrub your palms, the backs of your hands and between your fingers.",
    doneTitle: "Well done!",
    doneBody: "Washing hands with soap keeps germs away.",
    again: "Play again"
  }
};
let lang = "tet";
let stage = "find";      // find | tap | clean | wash | done
let found = false;
let timerLeft = 20, timerId = null;

const $ = id => document.getElementById(id);

function ui() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const remaining = germs.filter(g => g.alive).length;
  $("count").textContent = t.left(remaining);
  const title = $("cardTitle"), body = $("cardBody"), btn = $("cardBtn"), timer = $("timer");
  btn.hidden = true; timer.hidden = true;
  let s = stage;
  if ((s === "tap") && !found) s = "find";
  if (s === "find") { title.textContent = t.findTitle; body.textContent = t.findBody; }
  if (s === "tap") { title.textContent = t.tapTitle; body.textContent = t.tapBody; }
  if (s === "clean") { title.textContent = t.cleanTitle; body.textContent = t.cleanBody; btn.textContent = t.timerBtn; btn.hidden = false; }
  if (s === "wash") { title.textContent = t.washTitle; body.textContent = t.washBody; timer.hidden = false; timer.textContent = timerLeft; }
  if (s === "done") { title.textContent = t.doneTitle; body.textContent = t.doneBody; btn.textContent = t.again; btn.hidden = false; }
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; ui(); }));

// ---------- Textures drawn on canvas so there are no image files to load
function tex(draw, size = 128) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const spiky = tex((g, s) => {
  const cx = s / 2, r = s * 0.26;
  g.strokeStyle = "#3d6b12"; g.lineWidth = 5; g.lineCap = "round";
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * r, cx + Math.sin(a) * r);
    g.lineTo(cx + Math.cos(a) * r * 1.65, cx + Math.sin(a) * r * 1.65); g.stroke();
    g.beginPath(); g.arc(cx + Math.cos(a) * r * 1.7, cx + Math.sin(a) * r * 1.7, 4, 0, 7); g.fillStyle = "#9cc83c"; g.fill();
  }
  g.beginPath(); g.arc(cx, cx, r, 0, 7); g.fillStyle = "#9cc83c"; g.fill(); g.lineWidth = 4; g.stroke();
  g.fillStyle = "#c8e36b"; [[-.3, -.3], [.35, .1], [-.05, .4]].forEach(([x, y]) => { g.beginPath(); g.arc(cx + x * r, cx + y * r, r * .18, 0, 7); g.fill(); });
});
const rod = tex((g, s) => {
  g.translate(s / 2, s / 2); g.rotate(-0.5);
  g.strokeStyle = "#3d6b12"; g.lineWidth = 3;
  for (let i = -4; i <= 4; i++) { g.beginPath(); g.moveTo(i * 9, -16); g.lineTo(i * 9 - 4, -26); g.moveTo(i * 9, 16); g.lineTo(i * 9 + 4, 26); g.stroke(); }
  g.beginPath(); g.roundRect(-46, -17, 92, 34, 17); g.fillStyle = "#b5cf3a"; g.fill(); g.lineWidth = 4; g.stroke();
  g.fillStyle = "#e3b23c"; for (let i = -3; i <= 3; i++) { g.beginPath(); g.arc(i * 12, 0, 5, 0, 7); g.fill(); }
});
const bubble = tex((g, s) => {
  const cx = s / 2, r = s * 0.42;
  const grd = g.createRadialGradient(cx, cx, r * .6, cx, cx, r);
  grd.addColorStop(0, "rgba(255,255,255,0.15)"); grd.addColorStop(1, "rgba(255,255,255,0.9)");
  g.beginPath(); g.arc(cx, cx, r, 0, 7); g.fillStyle = grd; g.fill();
  g.strokeStyle = "rgba(120,180,220,0.9)"; g.lineWidth = 3; g.stroke();
  g.beginPath(); g.arc(cx - r * .35, cx - r * .35, r * .18, 0, 7); g.fillStyle = "#fff"; g.fill();
});

// ---------- Page coordinates: the page image is 925 x 1297 px; MindAR makes its width 1 unit, centred
const PW = 925, PH = 1297;
const px = (x, y) => new THREE.Vector3(x / PW - 0.5, (PH / 2 - y) / PW, 0);
// Germs sit over the two hand panels in the middle row
const SPOTS = [[150, 640, 0], [235, 630, 1], [270, 720, 0], [140, 745, 1], [365, 650, 0], [330, 735, 1], [430, 690, 0], [410, 790, 1]];

const germs = [];
const bubbles = [];
let mind, renderer, scene, camera, anchor;

function makeGerms() {
  SPOTS.forEach(([x, y, kind], i) => {
    const m = new THREE.SpriteMaterial({ map: kind ? rod : spiky, transparent: true, depthWrite: false });
    const s = new THREE.Sprite(m);
    const base = px(x, y);
    s.position.copy(base);
    const size = kind ? 0.11 : 0.09;
    s.scale.set(size, size, 1);
    anchor.group.add(s);
    germs.push({ sprite: s, base, size, alive: true, phase: i * 0.9, height: 0.04 + (i % 3) * 0.025, born: 0, dying: 0 });
  });
}

function popBubbles(at, n = 7) {
  for (let i = 0; i < n; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: bubble, transparent: true, depthWrite: false }));
    const size = 0.025 + Math.random() * 0.035;
    s.scale.set(size, size, 1);
    s.position.copy(at);
    anchor.group.add(s);
    bubbles.push({ sprite: s, vel: new THREE.Vector3((Math.random() - .5) * .12, (Math.random() - .2) * .12, .06 + Math.random() * .1), life: 1 });
  }
}

function resetGame() {
  germs.forEach(g => { g.alive = true; g.dying = 0; g.born = 0; g.sprite.visible = true; g.sprite.material.opacity = 1; });
  stage = "tap"; ui();
}

function onTap(ev) {
  if (stage !== "tap" || !found) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const p = ev.touches ? ev.touches[0] : ev;
  const ndc = new THREE.Vector2(((p.clientX - rect.left) / rect.width) * 2 - 1, -((p.clientY - rect.top) / rect.height) * 2 + 1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, camera);
  // Generous hit area for small fingers: test each sprite at 1.6x size
  let best = null, bestD = Infinity;
  for (const g of germs) {
    if (!g.alive) continue;
    const wp = new THREE.Vector3(); g.sprite.getWorldPosition(wp);
    const d = ray.ray.distanceToPoint(wp);
    const ws = new THREE.Vector3(); g.sprite.getWorldScale(ws);
    if (d < ws.x * 0.8 && d < bestD) { best = g; bestD = d; }
  }
  if (!best) return;
  best.alive = false; best.dying = 0.001;
  popBubbles(best.sprite.position.clone());
  if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
  if (germs.every(g => !g.alive)) setTimeout(() => { stage = "clean"; ui(); }, 700);
  ui();
}

function startTimer() {
  stage = "wash"; timerLeft = 20; ui();
  clearInterval(timerId);
  timerId = setInterval(() => {
    timerLeft--;
    if (found) for (let i = 0; i < 3; i++) popBubbles(px(80 + Math.random() * 420, 600 + Math.random() * 220), 1);
    if (timerLeft <= 0) { clearInterval(timerId); stage = "done"; }
    ui();
  }, 1000);
}

$("cardBtn").addEventListener("click", () => {
  if (stage === "clean") startTimer();
  else if (stage === "done") resetGame();
});

$("go").addEventListener("click", async () => {
  $("start").hidden = true; $("hud").hidden = false; $("card").hidden = false;
  stage = "tap"; ui();
  mind = new MindARThree({ container: $("ar"), imageTargetSrc: "sabaun.mind", uiScanning: "no", uiLoading: "yes", filterMinCF: 0.0001, filterBeta: 0.001 });
  ({ renderer, scene, camera } = mind);
  anchor = mind.addAnchor(0);
  anchor.onTargetFound = () => { found = true; ui(); };
  anchor.onTargetLost = () => { found = false; ui(); };
  makeGerms();
  $("ar").addEventListener("pointerdown", onTap);
  try {
    await mind.start();
  } catch (e) {
    $("cardTitle").textContent = lang === "tet" ? "Kámera la loke" : "Camera didn't open";
    $("cardBody").textContent = lang === "tet" ? "Permite kámera iha browser nia konfigurasaun, depois koko fali." : "Allow camera access in your browser settings, then reload the page.";
    return;
  }
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    for (const g of germs) {
      if (g.alive) {
        g.born = Math.min(1, g.born + dt * 1.5);
        g.sprite.position.set(g.base.x + Math.sin(t * 2 + g.phase) * 0.01, g.base.y + Math.cos(t * 1.7 + g.phase) * 0.01, g.height * g.born + Math.sin(t * 3 + g.phase) * 0.008);
        const k = g.size * (1 + Math.sin(t * 4 + g.phase) * 0.06);
        g.sprite.scale.set(k, k, 1);
      } else if (g.dying > 0) {
        g.dying += dt * 2.5;
        const k = g.size * (1 + g.dying * 0.8);
        g.sprite.scale.set(k, k, 1);
        g.sprite.material.opacity = Math.max(0, 1 - g.dying);
        if (g.dying >= 1) { g.dying = 0; g.sprite.visible = false; }
      }
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.life -= dt * 0.9;
      b.sprite.position.addScaledVector(b.vel, dt);
      b.sprite.material.opacity = Math.max(0, b.life);
      if (b.life <= 0) { anchor.group.remove(b.sprite); b.sprite.material.dispose(); bubbles.splice(i, 1); }
    }
    renderer.render(scene, camera);
  });
});

ui();
</script>
</body>
</html>
